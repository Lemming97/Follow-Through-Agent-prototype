name: Deploy to GitHub Pages

# Builds the site into docs/ on main.
# Pages setting: Source = Deploy from a branch, Branch = main, folder = /docs.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Copy the build into docs/
        run: |
          rm -rf docs
          cp -r dist docs
          touch docs/.nojekyll
      - name: Commit docs/ if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Rebuild site in docs/" && git push)
